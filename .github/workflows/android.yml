name: Android APK

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu runner image already ships the Android SDK. We provision
      # explicitly rather than via setup-android, which still tries to install
      # the retired "tools" package and fails.
      - name: Ensure Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK"
          SDKMGR="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          if [ -z "$SDKMGR" ]; then
            echo "sdkmanager not found under $SDK/cmdline-tools" >&2
            exit 1
          fi
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "Installed platforms:"; ls "$SDK/platforms"
          echo "Installed build-tools:"; ls "$SDK/build-tools"

      # setup-gradle keeps the cache read-only on non-default branches by
      # default, so every run here re-dexed the whole of Compose and media3
      # from scratch. Letting this branch write its cache is what makes the
      # second and later runs quick.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Split and time-boxed on purpose. A step that hangs past its box is
      # killed, which is the only way the job ends and its logs become
      # readable; and splitting says whether a stall is in Kotlin compilation
      # or later, in dexing and packaging.
      - name: Compile Kotlin
        working-directory: android
        timeout-minutes: 15
        run: ./gradlew --no-daemon --console=plain compileDebugKotlin

      - name: Assemble debug APK
        working-directory: android
        timeout-minutes: 20
        run: ./gradlew --no-daemon --console=plain assembleDebug

      # Upload the installable APK the moment it exists. The release build is
      # optional, and it must never be able to hold the deliverable hostage.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vixel-studio-apk-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Assemble release APK
        working-directory: android
        timeout-minutes: 20
        continue-on-error: true
        run: ./gradlew --no-daemon --console=plain assembleRelease

      - name: Report APK sizes
        if: always()
        working-directory: android
        run: |
          echo "### APK build output" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| APK | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | ---- |" >> "$GITHUB_STEP_SUMMARY"
          find app/build/outputs/apk -name '*.apk' -print0 | while IFS= read -r -d '' f; do
            size=$(du -h "$f" | cut -f1)
            echo "| \`$(basename "$f")\` | $size |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vixel-studio-apk-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 30

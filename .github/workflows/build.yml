name: Delicat Studio

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Provisioned explicitly rather than through setup-android, which still
      # reaches for the retired "tools" package and fails on it.
      - name: Ensure Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMGR="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)"
          [ -n "$SDKMGR" ] || { echo "sdkmanager not found under $SDK" >&2; exit 1; }
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      # Gradle is pinned here rather than through a committed wrapper jar. The
      # runner ships Gradle 9, which AGP 8.7.3 refuses to run under, so the
      # version has to be stated somewhere either way and this keeps a binary
      # out of the repository.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          # Without this the cache is read-only on any branch that is not the
          # default one, so every run re-dexes the whole of Compose from cold.
          cache-read-only: false

      # Split so a stall is attributable, and so unit tests run before the
      # slow packaging step rather than after it.
      - name: Compile
        timeout-minutes: 15
        run: gradle --no-daemon --console=plain compileDebugKotlin

      - name: Test
        timeout-minutes: 15
        run: gradle --no-daemon --console=plain testDebugUnitTest

      # Gradle prints the path to an HTML report nobody can open from a log.
      # The XML beside it holds the actual assertion, so it is echoed here.
      - name: Show what failed
        if: failure()
        run: |
          shopt -s nullglob
          for report in app/build/test-results/testDebugUnitTest/*.xml; do
            grep -q '<failure\|<error' "$report" || continue
            echo "--- $(basename "$report")"
            sed -n 's/.*\(<\(failure\|error\)[^>]*\).*/\1/p' "$report" | head -20
            sed -n '/<\(failure\|error\)/,/<\/\(failure\|error\)>/p' "$report" | head -40
          done

      - name: Assemble debug APK
        timeout-minutes: 20
        run: gradle --no-daemon --console=plain assembleDebug

      # The release comes first because it is the one people actually use: a
      # plain link that opens from a phone browser and is served with the
      # Android package content type, so it saves as .apk rather than .bin.
      # The artifact below needs a GitHub login and expires, and it used to sit
      # ahead of this — which meant a slow upload to a CDN nobody was waiting
      # on could hold up the only copy that matters.
      - name: Publish as a release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          [ -n "$apk" ] || { echo "no APK found" >&2; exit 1; }
          cp "$apk" delicat-studio.apk

          tag=latest
          notes=$(cat <<EOF
          Delicat Studio, rebuilt on every push.

          - commit: \`$GITHUB_SHA\`
          - built: $(date -u '+%Y-%m-%d %H:%M UTC')

          Open this link in Chrome on the phone and tap \`delicat-studio.apk\`
          from Downloads. Android will ask once to allow installs from your
          browser. Signed with the standard debug key, so it installs alongside
          a Play-signed copy rather than over one.
          EOF
          )

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" delicat-studio.apk --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" delicat-studio.apk \
              --title "Delicat Studio" --notes "$notes" --prerelease
          fi

      - name: Upload APK
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: delicat-studio-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Report size
        if: always()
        run: |
          echo "### APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          find app/build/outputs -name '*.apk' -print0 2>/dev/null |
            while IFS= read -r -d '' f; do
              echo "- \`$(basename "$f")\` — $(du -h "$f" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
            done

  # A separate job on purpose. It is the slowest thing here and the only one
  # that needs virtualisation, and the APK should never wait on it.
  device:
    name: Run on a device
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMGR="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-read-only: false

      # The emulator will not start without access to the host's virtualisation
      # device, and the runner image does not grant it by default.
      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          # swiftshader_indirect gives a real GLES 2 implementation without a
          # display, which is what the grading tests read their pixels back
          # from. The default host GPU mode has no display to draw into here.
          emulator-options: >-
            -no-window -no-snapshot -noaudio -no-boot-anim
            -gpu swiftshader_indirect -camera-back none -camera-front none
          disable-animations: true
          script: gradle --no-daemon --console=plain connectedDebugAndroidTest

      - name: Show what failed
        if: failure()
        run: |
          shopt -s nullglob
          for report in app/build/outputs/androidTest-results/connected/**/*.xml; do
            grep -q '<failure\|<error' "$report" || continue
            echo "--- $(basename "$report")"
            sed -n '/<\(failure\|error\)/,/<\/\(failure\|error\)>/p' "$report" | head -60
          done

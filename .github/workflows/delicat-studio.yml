name: Delicat Studio

on:
  push:
    paths:
      - 'delicat_studio/**'
      - '.github/workflows/delicat-studio.yml'
  pull_request:
    paths:
      - 'delicat_studio/**'
      - '.github/workflows/delicat-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delicat-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Analyze, test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: delicat_studio
        shell: bash
    env:
      # Secrets cannot be read in `if:`; expose only whether the upload key exists.
      HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Java 21: the Android lint bundled with this Android Gradle Plugin calls Java 21 APIs
      # (List.removeLast) and crashes on 17. The app itself still targets Java 17 bytecode.
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Optional: without the secrets, release builds are signed with the debug key
      # (fine for testing, not accepted by Google Play).
      - name: Configure upload key
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in UPLOAD_KEYSTORE_PASSWORD UPLOAD_KEY_ALIAS UPLOAD_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is missing (required with UPLOAD_KEYSTORE_BASE64)."
              exit 1
            fi
          done
          umask 077
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          # Escape backslashes for the .properties format.
          esc() { printf '%s' "${1//\\/\\\\}"; }
          {
            printf 'storePassword=%s\n' "$(esc "$UPLOAD_KEYSTORE_PASSWORD")"
            printf 'keyPassword=%s\n' "$(esc "$UPLOAD_KEY_PASSWORD")"
            printf 'keyAlias=%s\n' "$(esc "$UPLOAD_KEY_ALIAS")"
            printf 'storeFile=%s\n' "$(esc "$keystore")"
          } > android/key.properties
          echo "Upload key configured; release builds will be signed with it."

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Build app bundle
        run: flutter build appbundle --release

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: delicat-studio-apk-${{ github.run_number }}
          path: delicat_studio/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: delicat-studio-aab-${{ github.run_number }}
          path: delicat_studio/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove upload key
        if: always() && env.HAS_UPLOAD_KEY == 'true'
        run: rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks"

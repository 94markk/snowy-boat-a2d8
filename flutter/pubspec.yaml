name: delicat_studio
description: "Delicat Studio — video and photo editor"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # Export. The min-GPL build rather than the full one: x264 is GPL either
  # way, so the licence is already decided, and min keeps tens of megabytes of
  # codecs we never invoke out of the APK. Text and stickers are rasterised in
  # Dart and composited with the overlay filter, so none of the font-dependent
  # filters that only the full build carries are needed.
  ffmpeg_kit_flutter_new_min_gpl: ^2.6.2

  # Preview playback.
  video_player: ^2.14.0

  # Filmstrip frames, and the still the grading shader is applied to.
  video_thumbnail: ^0.5.6

  # Import and save.
  image_picker: ^1.2.3
  gal: ^2.3.3
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Colour grading runs as a fragment shader on the GPU. The same parameters
  # are baked into a 3D LUT for export, so the file matches the screen because
  # both are generated from one definition rather than implemented twice.
  shaders:
    - shaders/color_grade.frag
